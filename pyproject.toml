[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-efficiency-study"
version = "0.1.0"
description = "Estudo acadêmico de classificação para a disciplina de Inteligência Artificial e Computacional — Universidade Feevale"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.4",
  "pandas==3.1.1",
  "matplotlib==3.11.2",
  "scikit-learn==1.9.1",
  "ucimlrepo==0.0.7",
]

[project.optional-dependencies]
notebook = ["ipykernel==7.4.0", "nbconvert==7.17.2"]

[project.scripts]
energy-efficiency = "energy_efficiency.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
